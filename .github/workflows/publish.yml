# Publishes @slacklineinternational/onsight to npm when a GitHub release is published.
# Needs the repository secret NPM_TOKEN: an npm access token with publish rights for the @slacklineinternational scope.
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # npm provenance: shows on npmjs.com which commit and workflow built the package
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: The release tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${v} in package.json"; exit 1; }
      - name: Build and check (WCAG AA, audit)
        run: npm run check
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
