# Publishes @slacklineinternational/onsight to npm when a GitHub release is published.
# Uses npm trusted publishing: no token. npm trusts this workflow because it is registered on npmjs.com
# (package settings, Trusted publisher: GitHub Actions, owner rodeohub, repository onsight, workflow publish.yml).
# If the repository moves (for example to the slacklineinternational account), update the trusted publisher on npmjs.com first.
name: Publish to npm
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # trusted publishing and provenance: npm checks which repository and workflow is publishing
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No registry-url here: with it, setup-node writes a placeholder token that npm would try instead of trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm version with trusted publishing (11.5.1 or newer)
        run: npm install -g npm@latest
      - name: The release tag matches package.json
        run: |
          v="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${v}" || { echo "Tag ${GITHUB_REF_NAME} does not match version ${v} in package.json"; exit 1; }
      - name: Build and check (WCAG AA, audit)
        run: npm run check
      - name: dist/ is up to date
        run: git diff --exit-code -- dist
      - name: Publish
        run: npm publish --access public
