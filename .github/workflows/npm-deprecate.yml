# One-off maintenance: mark a version on npm as deprecated. Run it by hand (Actions, "Deprecate npm version", Run workflow).
# Uses the repository secret NPM_TOKEN; deprecating needs a token, trusted publishing only covers publishing.
name: Deprecate npm version
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deprecate
        required: true
        default: 0.0.0-stage
      message:
        description: Message shown to anyone who installs it
        required: true
        default: Placeholder created during setup, not a real release. Install the latest version.
permissions:
  contents: read
jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Deprecate
        run: npm deprecate "@slacklineinternational/onsight@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Show the result
        run: npm view "@slacklineinternational/onsight@${{ inputs.version }}" deprecated
