<!-- Drawer examples. Every snippet is valid usage; copy from here. Needs isa.js (or the React Drawer) to open and close. -->
<div class="row">
  <button type="button" class="isa-button isa-button--secondary" data-isa-dialog-open="ex-drawer-end">Open drawer (right)</button>
  <button type="button" class="isa-button isa-button--neutral" data-isa-dialog-open="ex-drawer-start">Open drawer (left)</button>
</div>
<dialog class="isa-drawer" id="ex-drawer-end" aria-labelledby="ex-drawer-end-title">
  <div class="isa-drawer__header">
    <h2 class="isa-drawer__title" id="ex-drawer-end-title">Filters</h2>
    <button type="button" class="isa-button isa-button--ghost isa-button--icon" aria-label="Close" data-isa-dialog-close><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="isa-drawer__body">
    <fieldset class="isa-fieldset">
      <legend class="isa-label">Disciplines</legend>
      <label class="isa-check"><input type="checkbox" checked> <span>Freestyle Highline</span></label>
      <label class="isa-check"><input type="checkbox"> <span>Speed Highline</span></label>
    </fieldset>
  </div>
</dialog>
<dialog class="isa-drawer isa-drawer--start" id="ex-drawer-start" aria-labelledby="ex-drawer-start-title">
  <div class="isa-drawer__header">
    <h2 class="isa-drawer__title" id="ex-drawer-start-title">Menu</h2>
    <button type="button" class="isa-button isa-button--ghost isa-button--icon" aria-label="Close" data-isa-dialog-close><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="isa-drawer__body"><p>Drawer content.</p></div>
</dialog>
