<!-- Avatar examples. Every snippet is valid usage; copy from here. With a photo: <span class="isa-avatar"><img src="..." alt="Name"></span> -->
<h3>Sizes (initials shown when there is no photo)</h3>
<div class="row">
  <span class="isa-avatar isa-avatar--small" role="img" aria-label="Lena Example">LE</span>
  <span class="isa-avatar" role="img" aria-label="Lena Example">LE</span>
  <span class="isa-avatar isa-avatar--large" role="img" aria-label="Lena Example">LE</span>
  <span class="isa-avatar isa-avatar--xlarge" role="img" aria-label="Lena Example">LE</span>
</div>
<h3>Square (clubs, organizations) and next to a name</h3>
<div class="row">
  <span class="isa-avatar isa-avatar--large isa-avatar--square" role="img" aria-label="Swiss Slackline">SS</span>
  <span class="row" style="margin: 0"><span class="isa-avatar isa-avatar--small" aria-hidden="true">LE</span> Lena Example</span>
</div>
