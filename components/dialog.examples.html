<!-- Dialog examples. Every snippet is valid usage; copy from here. Needs isa.js (or the React Dialog) to open and close. -->
<div class="row">
  <button type="button" class="isa-button isa-button--secondary" data-isa-dialog-open="ex-dialog">Open dialog</button>
  <button type="button" class="isa-button isa-button--danger-secondary" data-isa-dialog-open="ex-confirm">Withdraw from event</button>
</div>
<dialog class="isa-dialog" id="ex-dialog" aria-labelledby="ex-dialog-title">
  <div class="isa-dialog__header">
    <h2 class="isa-dialog__title" id="ex-dialog-title">Edit profile</h2>
    <button type="button" class="isa-button isa-button--ghost isa-button--icon" aria-label="Close" data-isa-dialog-close><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="isa-dialog__body">
    <div class="isa-field">
      <label class="isa-label" for="ex-d-name">Display name</label>
      <input class="isa-input" id="ex-d-name" type="text" value="Lena Example" autofocus>
    </div>
  </div>
  <div class="isa-dialog__footer">
    <button type="button" class="isa-button isa-button--neutral" data-isa-dialog-close>Cancel</button>
    <button type="button" class="isa-button" data-isa-dialog-close>Save</button>
  </div>
</dialog>
<dialog class="isa-dialog" id="ex-confirm" aria-labelledby="ex-confirm-title">
  <div class="isa-dialog__header">
    <h2 class="isa-dialog__title" id="ex-confirm-title">Withdraw from Swiss Highline Open?</h2>
    <button type="button" class="isa-button isa-button--ghost isa-button--icon" aria-label="Close" data-isa-dialog-close><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="isa-dialog__body">
    <p>Your place goes to the next athlete on the waiting list. You cannot undo this.</p>
  </div>
  <div class="isa-dialog__footer">
    <button type="button" class="isa-button isa-button--neutral" data-isa-dialog-close>Keep my place</button>
    <button type="button" class="isa-button isa-button--danger" data-isa-dialog-close>Withdraw</button>
  </div>
</dialog>
