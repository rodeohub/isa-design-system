<!-- Spinner examples. Every snippet is valid usage; copy from here. -->
<h3>Sizes</h3>
<div class="row">
  <span class="isa-spinner isa-spinner--small" role="status"><span class="isa-visually-hidden">Loading</span></span>
  <span class="isa-spinner" role="status"><span class="isa-visually-hidden">Loading</span></span>
  <span class="isa-spinner isa-spinner--large" role="status"><span class="isa-visually-hidden">Loading</span></span>
</div>
<h3>With visible text (preferred for whole sections)</h3>
<div class="isa-loading" role="status"><span class="isa-spinner" aria-hidden="true"></span> Loading rankings…</div>
<h3>On a brand surface</h3>
<div class="row brand" data-isa-surface="brand" style="color: var(--isa-color-text-inverse)">
  <span class="isa-spinner isa-spinner--inherit" role="status"><span class="isa-visually-hidden">Loading</span></span>
</div>
