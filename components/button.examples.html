<!-- Button examples. Every snippet is valid usage; copy from here. -->
<h3>Variants</h3>
<div class="row">
  <button type="button" class="isa-button">Primary</button>
  <button type="button" class="isa-button isa-button--secondary">Secondary</button>
  <button type="button" class="isa-button isa-button--neutral">Neutral</button>
  <button type="button" class="isa-button isa-button--ghost">Ghost</button>
  <button type="button" class="isa-button isa-button--danger">Danger</button>
  <button type="button" class="isa-button isa-button--danger-secondary">Danger secondary</button>
</div>
<h3>Small</h3>
<div class="row">
  <button type="button" class="isa-button isa-button--small">Primary</button>
  <button type="button" class="isa-button isa-button--secondary isa-button--small">Secondary</button>
  <button type="button" class="isa-button isa-button--neutral isa-button--small">Neutral</button>
  <button type="button" class="isa-button isa-button--ghost isa-button--small">Ghost</button>
  <button type="button" class="isa-button isa-button--danger isa-button--small">Danger</button>
  <button type="button" class="isa-button isa-button--danger-secondary isa-button--small">Danger secondary</button>
</div>
<h3>Disabled</h3>
<div class="row">
  <button type="button" class="isa-button" disabled>Primary</button>
  <button type="button" class="isa-button isa-button--secondary" disabled>Secondary</button>
  <button type="button" class="isa-button isa-button--danger" disabled>Danger</button>
</div>
<h3>Loading</h3>
<div class="row">
  <button type="button" class="isa-button" aria-busy="true" aria-disabled="true">Saving…</button>
  <button type="button" class="isa-button isa-button--secondary" aria-busy="true" aria-disabled="true">Loading results…</button>
</div>
<h3>With icon, icon only, link, full width</h3>
<div class="row">
  <button type="button" class="isa-button">View results <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  <button type="button" class="isa-button isa-button--ghost isa-button--icon" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <button type="button" class="isa-button isa-button--ghost isa-button--icon isa-button--small" aria-label="Close"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <a class="isa-button isa-button--secondary" href="#">Link styled as button</a>
</div>
<div class="row" style="max-width: 22.5rem">
  <button type="button" class="isa-button isa-button--full">Register for this event</button>
</div>
<h3>On a brand surface (white focus ring)</h3>
<div class="row brand" data-isa-surface="brand">
  <button type="button" class="isa-button isa-button--secondary">Sign in</button>
  <button type="button" class="isa-button isa-button--neutral">Menu</button>
</div>
