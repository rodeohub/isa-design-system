<!-- Badge examples. Every snippet is valid usage; copy from here. -->
<h3>Category colors</h3>
<div class="row">
  <span class="isa-badge">Neutral</span>
  <span class="isa-badge isa-badge--brand">Brand</span>
  <span class="isa-badge isa-badge--red">Red</span>
  <span class="isa-badge isa-badge--green">Green</span>
  <span class="isa-badge isa-badge--blue">Blue</span>
  <span class="isa-badge isa-badge--teal">Teal</span>
  <span class="isa-badge isa-badge--orange">Orange</span>
  <span class="isa-badge isa-badge--yellow">Yellow</span>
  <span class="isa-badge isa-badge--pink">Pink</span>
  <span class="isa-badge isa-badge--violet">Violet</span>
  <span class="isa-badge isa-badge--purple">Purple</span>
</div>
<h3>Outline</h3>
<div class="row">
  <span class="isa-badge isa-badge--outline">Neutral</span>
  <span class="isa-badge isa-badge--brand isa-badge--outline">Brand</span>
  <span class="isa-badge isa-badge--red isa-badge--outline">Red</span>
  <span class="isa-badge isa-badge--green isa-badge--outline">Green</span>
  <span class="isa-badge isa-badge--blue isa-badge--outline">Blue</span>
  <span class="isa-badge isa-badge--teal isa-badge--outline">Teal</span>
  <span class="isa-badge isa-badge--orange isa-badge--outline">Orange</span>
  <span class="isa-badge isa-badge--yellow isa-badge--outline">Yellow</span>
  <span class="isa-badge isa-badge--pink isa-badge--outline">Pink</span>
  <span class="isa-badge isa-badge--violet isa-badge--outline">Violet</span>
  <span class="isa-badge isa-badge--purple isa-badge--outline">Purple</span>
</div>
<h3>Status (the label names the status)</h3>
<div class="row">
  <span class="isa-badge isa-badge--success">Confirmed</span>
  <span class="isa-badge isa-badge--warning">Pending</span>
  <span class="isa-badge isa-badge--danger">Cancelled</span>
  <span class="isa-badge isa-badge--info">Upcoming</span>
</div>
<h3>With icon</h3>
<div class="row">
  <span class="isa-badge isa-badge--brand isa-badge--outline"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg> ISA verified</span>
</div>
