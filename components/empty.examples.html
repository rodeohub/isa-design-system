<!-- Empty state examples. Every snippet is valid usage; copy from here. -->
<h3>Nothing yet, with a next step</h3>
<div class="isa-empty">
  <h4 class="isa-empty__title">No events yet</h4>
  <p class="isa-empty__text">Events you organize will appear here once you have registered one.</p>
  <div class="isa-empty__actions"><a class="isa-button" href="#">Register an event</a></div>
</div>
<h3>No results for a search or filter</h3>
<div class="isa-empty">
  <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
  <h4 class="isa-empty__title">No athletes match your filters</h4>
  <p class="isa-empty__text">Try removing a filter or checking the spelling.</p>
  <div class="isa-empty__actions"><button type="button" class="isa-button isa-button--neutral">Clear filters</button></div>
</div>
