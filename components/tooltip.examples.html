<!-- Tooltip examples. Every snippet is valid usage; copy from here. Hover or focus the buttons. -->
<h3>Info button next to a label</h3>
<div class="row">
  <span class="isa-label">Contest size</span>
  <span class="isa-tooltip isa-tooltip--start">
    <button type="button" class="isa-button isa-button--ghost isa-button--icon isa-button--small" aria-label="About contest size" aria-describedby="ex-tip-1"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg></button>
    <span class="isa-tooltip__content" role="tooltip" id="ex-tip-1">The size sets how many ranking points an event gives.</span>
  </span>
</div>
<h3>On a button, below</h3>
<div class="row">
  <span class="isa-tooltip isa-tooltip--bottom">
    <button type="button" class="isa-button isa-button--neutral" aria-describedby="ex-tip-2">Export</button>
    <span class="isa-tooltip__content" role="tooltip" id="ex-tip-2">Downloads the ranking as a CSV file.</span>
  </span>
</div>
