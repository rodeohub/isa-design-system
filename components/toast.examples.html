<!-- Toast examples. Every snippet is valid usage; copy from here. Needs isa.js (or the React ToastProvider). -->
<div class="row">
  <button type="button" class="isa-button isa-button--neutral" data-isa-toast="Results saved." data-isa-toast-variant="success">Show success</button>
  <button type="button" class="isa-button isa-button--neutral" data-isa-toast="Registration closes in 2 days.">Show info</button>
  <button type="button" class="isa-button isa-button--neutral" data-isa-toast="Your session ends in 5 minutes." data-isa-toast-variant="warning">Show warning</button>
  <button type="button" class="isa-button isa-button--neutral" data-isa-toast="Check your connection and try again." data-isa-toast-title="Could not save" data-isa-toast-variant="danger">Show error (stays until closed)</button>
</div>
